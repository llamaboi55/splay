[package]
name = "splay"
version = "1.0.0"
description = "A full-screen app launcher with search, folders and a calculator. Free and open source."
authors = ["Chipper-AOS"]
license = "MIT"
edition = "2021"
rust-version = "1.86"

[lib]
name = "splay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
file_icon_provider = "1"
png = "0.17"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
freedesktop-icons = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
